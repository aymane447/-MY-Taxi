services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mytaxi_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Montage de l'ensemble du code source pour refléter immédiatement les modifications (PHP/JS/CSS)
      - ./:/var/www/html
      # Montage dédié du dossier database pour garantir la persistance des données SQLite sur l'hôte
      - ./database:/var/www/html/database
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data

